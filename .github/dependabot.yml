version: 2
updates:
- package-ecosystem: npm
  directories:
    - "/samples/RNWinRTTestApp"
    - "/sdk/react"
    - "/tests/RnWinRTTests"
  target-branch: "main"
  cooldown:
    default-days: 8
  groups:
    all-dependencies:
      applies-to: version-updates
      patterns:
        - '*'
      update-types:
        - 'minor'
        - 'patch'
    security-updates:
      applies-to: security-updates
      patterns:
        - '*'
  schedule:
    interval: weekly
    time: "05:00"
    timezone: "America/Los_Angeles"
  labels:
    - dependencies
  versioning-strategy: lockfile-only
  commit-message:
    prefix: 📦
  open-pull-requests-limit: 5
